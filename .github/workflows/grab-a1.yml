# Keeps trying to create the free Oracle Ampere A1 server for Safha until
# Oracle has capacity (Mumbai often answers "Out of host capacity"). Once the
# server exists it opens an issue with the IP and disables itself.
# Secrets: OCI_USER_OCID, OCI_TENANCY_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY,
# OCI_SSH_PUBLIC_KEY, optional KAGGLE_API_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: Grab Oracle A1 server

on:
  # Hourly watchdog only: it never calls Oracle itself (two runs at once got
  # "429 Too many requests"); it restarts the loop if the loop has stopped.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      loop_attempts:
        description: "Attempts in this run, 5 minutes apart (60 = about 5 hours); then the run starts the next one"
        default: "60"
      attempt_offset:
        description: "Attempts made by earlier runs (keeps the Telegram count going)"
        default: "0"

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restart the loop if no run is active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=0
          for s in in_progress queued pending waiting requested; do
            n=$(gh run list -R "$REPO" -w grab-a1.yml -e workflow_dispatch -s "$s" --json databaseId --jq length)
            active=$((active + n))
          done
          echo "active loop runs: $active"
          if [ "$active" -eq 0 ]; then
            gh workflow run grab-a1.yml -R "$REPO" -f loop_attempts=60
            echo "::notice title=Watchdog::The loop had stopped; started a new run."
          fi

  grab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: oracle-a1-grab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q oci==2.189.0 pytest
      - run: python -m pytest -q tests
      - name: Try to create the server
        id: grab
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OCI_REGION: ap-mumbai-1
          ATTEMPTS: ${{ inputs.loop_attempts || '60' }}
          ATTEMPT_OFFSET: ${{ inputs.attempt_offset || '0' }}
          ATTEMPT_GAP_S: "300"
          NOTIFY_EACH: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python launch_a1.py
      - name: Announce the server and stop retrying
        if: steps.grab.outputs.created == '1' || contains(fromJSON('["created","exists","upgraded"]'), steps.grab.outputs.status)
        env:
          GH_TOKEN: ${{ github.token }}
          IP: ${{ steps.grab.outputs.public_ip }}
          STATUS: ${{ steps.grab.outputs.status }}
        run: |
          if [ "${{ steps.grab.outputs.created }}" = "1" ]; then
            gh issue create --title "Oracle A1 server ready: $IP" --body "The free Oracle Ampere A1 server **safha-server** was created in ap-mumbai-1.

          - Public IP: \`$IP\`
          - SSH: \`ssh -i safha-server-key ubuntu@$IP\`
          - Bootstrap log: \`/var/log/safha-bootstrap.log\` (Docker, repo, models; ~10 minutes)
          - Next: \`CLOUDFLARE_TUNNEL_TOKEN=... /opt/safha-server/deploy.sh\`."
          fi
          case "$STATUS" in created|exists|upgraded) gh workflow disable grab-a1.yml ;; *) echo "still growing the server; loop continues" ;; esac
      # The loop does not depend on GitHub's (unreliable) schedule: a manual
      # run keeps trying for ~5 hours, then starts its successor.
      - name: Keep trying in a new run
        if: contains(fromJSON('["no_capacity","created_small","resizing"]'), steps.grab.outputs.status)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run grab-a1.yml -f loop_attempts=${{ inputs.loop_attempts || '60' }} -f attempt_offset=${{ steps.grab.outputs.attempts || '0' }}
      - name: Telegram update on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.grab.outputs.status || 'error' }}
          PUBLIC_IP: ${{ steps.grab.outputs.public_ip }}
          ATTEMPTS: ${{ steps.grab.outputs.attempts }}
          ERROR: ${{ steps.grab.outputs.error }}
        run: python notify_telegram.py
      - name: Summary
        if: always()
        run: echo "status=${{ steps.grab.outputs.status }} ip=${{ steps.grab.outputs.public_ip }}" >> "$GITHUB_STEP_SUMMARY"
